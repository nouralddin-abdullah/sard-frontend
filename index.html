<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Defaults for pages that set none. data-rh marks them as react-helmet-async's, so a page's own tags replace
         them instead of being added after them (crawlers read the first description / og:title they find). -->
    <meta data-rh="true" name="description" content="سرد منصة عربية لقراءة الروايات وكتابتها: روايات أصلية يكتبها كتّاب عرب في الفانتازيا والرومانسية والغموض والأكشن والخيال العلمي، تُنشر فصلاً بعد فصل." />
    <meta data-rh="true" name="keywords" content="روايات عربية، قصص، كتابة، قراءة، سرد، روايات، أدب عربي" />
    <meta data-rh="true" name="author" content="سرد" />
    <meta data-rh="true" name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags for Social Media -->
    <meta data-rh="true" property="og:title" content="سرد - منصة القراءة والكتابة العربية" />
    <meta data-rh="true" property="og:description" content="سرد منصة عربية لقراءة الروايات وكتابتها: روايات أصلية يكتبها كتّاب عرب في الفانتازيا والرومانسية والغموض والأكشن والخيال العلمي، تُنشر فصلاً بعد فصل." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:image" content="https://www.sardnovels.com/og-default.jpg" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:site_name" content="سرد" />
    <meta data-rh="true" property="og:locale" content="ar_AR" />
    
    <!-- Twitter Card Meta Tags -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="سرد - منصة القراءة والكتابة العربية" />
    <meta data-rh="true" name="twitter:description" content="سرد منصة عربية لقراءة الروايات وكتابتها: روايات أصلية يكتبها كتّاب عرب في الفانتازيا والرومانسية والغموض والأكشن والخيال العلمي، تُنشر فصلاً بعد فصل." />
    <meta data-rh="true" name="twitter:image" content="https://www.sardnovels.com/og-default.jpg" />
    
    <!-- No canonical/og:url here: this shell is served for every URL, so a fixed value would tell Google that
         every page is a copy of the home page. Each page sets its own through react-helmet-async. -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@800&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <title>سرد - منصة القراءة والكتابة العربية</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
