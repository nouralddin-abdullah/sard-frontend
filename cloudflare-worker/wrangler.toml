name = "sard-seo-worker"
main = "seo-worker.js"
compatibility_date = "2024-11-12"

# Environment variables
[vars]
API_URL = "https://api-sareed.runasp.net"

# Routes: the worker answers crawlers on the public pages below and passes every other request (and every
# non-crawler visitor) straight through to the web app. A pattern without a trailing * matches that exact URL only
# (no query string), so "/" is the home page alone rather than the whole site.
[[routes]]
pattern = "www.sardnovels.com/"
zone_name = "sardnovels.com"

[[routes]]
pattern = "www.sardnovels.com/home*"
zone_name = "sardnovels.com"

[[routes]]
pattern = "www.sardnovels.com/genre/*"
zone_name = "sardnovels.com"

[[routes]]
pattern = "www.sardnovels.com/profile/*"
zone_name = "sardnovels.com"

# Novels, chapters and novel wikis.
[[routes]]
pattern = "www.sardnovels.com/novel/*"
zone_name = "sardnovels.com"

# Share images for link previews.
[[routes]]
pattern = "www.sardnovels.com/api/og/*"
zone_name = "sardnovels.com"

# sitemap.xml, and sitemap-N.xml once there are more than 50,000 URLs.
[[routes]]
pattern = "www.sardnovels.com/sitemap*"
zone_name = "sardnovels.com"
